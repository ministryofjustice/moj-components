name: Static Application Security Testing
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  run-sast-tooling:
    uses: ministryofjustice/laa-reusable-github-actions/.github/workflows/sast.yml@7152e5b52e016ee20bca10b13d716c4f087599b4 # main as of 28/10/2026
    permissions:
      actions: read
      id-token: write
      contents: read
      security-events: write
    with:
      iac_path: ".github/deployments"
    secrets:
      SNYK_CLIENT_ID: ${{ secrets.SNYK_CLIENT_ID }}
      SNYK_CLIENT_SECRET: ${{ secrets.SNYK_CLIENT_SECRET }}
      ECR_ROLE_TO_ASSUME: ${{ secrets.ECR_ROLE_TO_ASSUME }}
