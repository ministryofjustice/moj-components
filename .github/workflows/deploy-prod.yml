name: Deploy production

permissions: {}

on:
  workflow_run:
    workflows:
      - Publish to RubyGems
    types:
      - completed

jobs:
  deploy-prod:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Assume role in Cloud Platform
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.ECR_REGION }}

      # Login to container repository
      - uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        id: login-ecr

      - name: Derive image tag
        run: |
          IMAGE_TAG="${{ github.event.workflow_run.head_branch }}"
          IMAGE_TAG="${IMAGE_TAG#release/}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      # Build and push a Docker image to the container repository
      - run: |
          docker build -f spec/dummy/Dockerfile -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      - run: |
          mkdir -p deployments
          cat .github/deployments/deployment.yml | envsubst > deployments/deployment.yml
          cat .github/deployments/ingress.yml | envsubst > deployments/ingress.yml
          cat .github/deployments/service.yml | envsubst > deployments/service.yml
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          NAMESPACE: ${{ secrets.KUBE_PROD_NAMESPACE }}
          APP_SECRET_NAME: moj-components-prod-secrets
      - run: |
          echo "${{ secrets.KUBE_PROD_CERT }}" > ca.crt
          kubectl config set-cluster ${KUBE_CLUSTER} --certificate-authority=./ca.crt --server=https://${KUBE_CLUSTER}
          kubectl config set-credentials deploy-user --token=${{ secrets.KUBE_PROD_TOKEN }}
          kubectl config set-context ${KUBE_CLUSTER} --cluster=${KUBE_CLUSTER} --user=deploy-user --namespace=${KUBE_NAMESPACE}
          kubectl config use-context ${KUBE_CLUSTER}
          kubectl -n ${KUBE_NAMESPACE} apply -f deployments/
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_PROD_NAMESPACE }}
          KUBE_CLUSTER: ${{ secrets.KUBE_PROD_CLUSTER }}
