apiVersion: apps/v1
kind: Deployment
metadata:
  name: moj-components-docs-deployment
  labels:
    app: moj-components-docs
spec:
  replicas: 3
  selector:
    matchLabels:
      app: moj-components-docs # this should match the selector in service.yml
  template:
    metadata:
      labels:
        app: moj-components-docs # this should match the selector in service.yml
    spec:
      containers:
        - name: moj-components-docs
          image: ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: ${APP_SECRET_NAME}
                  key: secretKeyBase
          ports:
            - containerPort: 80
